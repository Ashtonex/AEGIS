services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - imperium-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOSTNAME: ${API_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  imperium-api:
    build:
      context: ../../imperium-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_HOSTNAME: ${FRONTEND_HOSTNAME}
      REDIS_URL: ${REDIS_URL}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      # 2 workers x (pool 10 + overflow 10) = 40 client connections to
      # Supavisor's transaction pooler (port 6543), the same total the
      # 2026-10-07 stress test validated with 4 x (5+5). Two workers, not
      # four: on the 1 GB droplet four API processes plus the arq worker
      # used ~800 MB and 1 GB of swap, so every deploy restart took minutes
      # to answer and Caddy served 502s meanwhile (2026-10-08).
      # Read from AEGIS_WEB_CONCURRENCY rather than WEB_CONCURRENCY so an
      # old WEB_CONCURRENCY=4 left in the droplet's .env can't override it.
      WEB_CONCURRENCY: ${AEGIS_WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_COMMAND_TIMEOUT_SECONDS: ${DB_COMMAND_TIMEOUT_SECONDS:-30}
      MICROSOFT_GRAPH_TENANT_ID: ${MICROSOFT_GRAPH_TENANT_ID:-}
      MICROSOFT_GRAPH_CLIENT_ID: ${MICROSOFT_GRAPH_CLIENT_ID:-}
      MICROSOFT_GRAPH_CLIENT_SECRET: ${MICROSOFT_GRAPH_CLIENT_SECRET:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  imperium-worker:
    build:
      context: ../../imperium-api
    restart: unless-stopped
    command: arq app.workers.arq_worker.WorkerSettings
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_HOSTNAME: ${FRONTEND_HOSTNAME}
      REDIS_URL: ${REDIS_URL}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      # The worker talks to SharePoint too (Teams bank workbook sync, and
      # fetching SharePoint-stored files for text extraction).
      MICROSOFT_GRAPH_TENANT_ID: ${MICROSOFT_GRAPH_TENANT_ID:-}
      MICROSOFT_GRAPH_CLIENT_ID: ${MICROSOFT_GRAPH_CLIENT_ID:-}
      MICROSOFT_GRAPH_CLIENT_SECRET: ${MICROSOFT_GRAPH_CLIENT_SECRET:-}

volumes:
  caddy_data:
  caddy_config:
