services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - imperium-api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOSTNAME: ${API_HOSTNAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  imperium-api:
    build:
      context: ../../imperium-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_HOSTNAME: ${FRONTEND_HOSTNAME}
      REDIS_URL: ${REDIS_URL}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      # 4 workers x (pool 3 + overflow 2) = 20 total DB connections for this
      # service - the same aggregate ceiling core/database.py's pool_size=10,
      # max_overflow=10 already proved stable at when it was one process.
      # Override any of these three in the droplet's .env if load testing
      # says otherwise; they're defaulted here so the deploy works without
      # requiring that file to be touched.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      MICROSOFT_GRAPH_TENANT_ID: ${MICROSOFT_GRAPH_TENANT_ID:-}
      MICROSOFT_GRAPH_CLIENT_ID: ${MICROSOFT_GRAPH_CLIENT_ID:-}
      MICROSOFT_GRAPH_CLIENT_SECRET: ${MICROSOFT_GRAPH_CLIENT_SECRET:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  imperium-worker:
    build:
      context: ../../imperium-api
    restart: unless-stopped
    command: arq app.workers.arq_worker.WorkerSettings
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DEBUG: ${DEBUG}
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      FRONTEND_HOSTNAME: ${FRONTEND_HOSTNAME}
      REDIS_URL: ${REDIS_URL}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      # The worker talks to SharePoint too (Teams bank workbook sync, and
      # fetching SharePoint-stored files for text extraction).
      MICROSOFT_GRAPH_TENANT_ID: ${MICROSOFT_GRAPH_TENANT_ID:-}
      MICROSOFT_GRAPH_CLIENT_ID: ${MICROSOFT_GRAPH_CLIENT_ID:-}
      MICROSOFT_GRAPH_CLIENT_SECRET: ${MICROSOFT_GRAPH_CLIENT_SECRET:-}

volumes:
  caddy_data:
  caddy_config:
