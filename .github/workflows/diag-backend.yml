name: Diagnose Backend

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and inspect
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -x
            cd /opt/aegis
            echo "--- container status ---"
            docker compose -f deploy/digitalocean/docker-compose.yml ps
            echo "--- imperium-api errors/500s since deploy (~2h) ---"
            docker compose -f deploy/digitalocean/docker-compose.yml logs --since=2h imperium-api 2>&1 | grep -iE "error|500 Internal|traceback|exception" | tail -400 || true
            echo "--- db pool pressure/timeout events since deploy (~2h) ---"
            docker compose -f deploy/digitalocean/docker-compose.yml logs --since=2h imperium-api 2>&1 | grep -F "db_pool_" | tail -200 || true
            echo "--- current git commit on droplet ---"
            git log -1 --oneline
            echo "--- disk/memory ---"
            df -h /
            free -h
