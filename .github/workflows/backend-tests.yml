name: Backend Tests

# Until now, deploy-backend.yml pushed straight to production on every push
# to main with no test gate at all - this runs the pytest suite on pull
# requests (and as an early warning on main) so a broken change is caught
# before deploy-backend.yml ships it. No DATABASE_URL/REDIS_URL secrets are
# configured here deliberately - the suite already skips its
# Postgres-dependent tests when no live database is reachable (see the
# `skipped` count in local runs), so this still exercises the ~930
# non-DB unit/contract tests without provisioning a CI database.

on:
  pull_request:
    paths:
      - "imperium-api/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "imperium-api/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imperium-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: imperium-api/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          ENVIRONMENT: testing
        run: python -m pytest -q
