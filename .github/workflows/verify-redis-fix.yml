name: Verify Redis Fix (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/aegis
            echo "--- removing orphaned local redis container (deleted from compose file, but still running) ---"
            docker compose -f deploy/digitalocean/docker-compose.yml --env-file deploy/digitalocean/.env up -d --remove-orphans
            docker volume rm digitalocean_redis_data 2>/dev/null || true
            echo "--- running containers after cleanup ---"
            docker compose -f deploy/digitalocean/docker-compose.yml ps
            echo "--- confirming no local redis container exists ---"
            docker ps -a --filter "name=redis" --format "{{.Names}}\t{{.Image}}\t{{.Status}}" || echo "(none found - clean)"
