name: Verify Redis Fix (one-off diagnostic)

on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/aegis
            echo "--- running containers ---"
            docker compose -f deploy/digitalocean/docker-compose.yml ps
            echo "--- confirming no local redis container exists ---"
            docker ps -a --filter "name=redis" --format "{{.Names}}\t{{.Image}}\t{{.Status}}" || true
            echo "--- worker startup/redis_target log lines ---"
            docker compose -f deploy/digitalocean/docker-compose.yml logs imperium-worker --since 20m | grep -iE "redis_target|starting up|redis|error|exception" | tail -60
            echo "--- worker_health.json (proves process is alive and wrote startup file) ---"
            docker compose -f deploy/digitalocean/docker-compose.yml exec -T imperium-worker cat worker_health.json || true
