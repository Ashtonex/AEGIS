name: One-off - Update droplet .env for CCB Redis worker

on:
  workflow_dispatch: {}

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and update .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: CCB_REDIS_URL
          script: |
            set -euo pipefail
            ENV_FILE=/opt/aegis/deploy/digitalocean/.env
            cp "$ENV_FILE" "$ENV_FILE.bak.$(date +%s)"
            if grep -q '^REDIS_URL=' "$ENV_FILE"; then
              sed -i "s|^REDIS_URL=.*|REDIS_URL=${CCB_REDIS_URL}|" "$ENV_FILE"
            else
              echo "REDIS_URL=${CCB_REDIS_URL}" >> "$ENV_FILE"
            fi
            if grep -q '^BACKGROUND_JOBS_ENABLED=' "$ENV_FILE"; then
              sed -i "s|^BACKGROUND_JOBS_ENABLED=.*|BACKGROUND_JOBS_ENABLED=true|" "$ENV_FILE"
            else
              echo "BACKGROUND_JOBS_ENABLED=true" >> "$ENV_FILE"
            fi
            echo "--- verification (values masked by GitHub, keys only) ---"
            grep -oE '^(REDIS_URL|BACKGROUND_JOBS_ENABLED)=' "$ENV_FILE"
            echo "REDIS_URL host portion: $(grep '^REDIS_URL=' "$ENV_FILE" | sed -E 's#.*@##')"
            echo "BACKGROUND_JOBS_ENABLED value: $(grep '^BACKGROUND_JOBS_ENABLED=' "$ENV_FILE")"
