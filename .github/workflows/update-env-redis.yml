name: One-off - Verify droplet .env integrity

on:
  workflow_dispatch: {}

jobs:
  verify-env:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and verify .env
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            ENV_FILE=/opt/aegis/deploy/digitalocean/.env
            echo "--- line count ---"
            wc -l "$ENV_FILE"
            echo "--- keys present (values masked) ---"
            grep -oE '^[A-Z_]+=' "$ENV_FILE" | sort
            echo "--- any line NOT matching KEY=value shape (would indicate corruption) ---"
            grep -vE '^[A-Z_]+=' "$ENV_FILE" || echo "(none - file is clean)"
