name: Frontend CI

# Nothing in the pipeline could previously catch a frontend regression
# before it reached main (see AEGIS Performance Audit, Part 4 "No
# performance testing anywhere" / Part 5 item 4.8) - this is the first gate:
# typecheck, lint and a full production build on every change to aegis-web.
# The shared-bundle size budget runs after the build; Lighthouse/web-vitals
# budgets are still a follow-up.

on:
  pull_request:
    paths:
      - "aegis-web/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "aegis-web/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aegis-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Shared client JS that every route downloads, gzipped. Baseline was
      # 165.8 kB on 2026-10-03; the budget leaves headroom so it
      # catches real growth, not unrelated work. Lower it as splitting lands.
      - name: Bundle budget
        run: node scripts/check-bundle-budget.js
        env:
          FIRST_LOAD_BUDGET_KB: "200"
