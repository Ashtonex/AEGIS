name: Deploy Backend to DigitalOcean

on:
  push:
    branches: [ "main" ]
    paths:
      - "imperium-api/**"
      - "deploy/digitalocean/**"
  workflow_dispatch: {}

jobs:
  # The deploy only runs if the backend test suite passes for this commit.
  tests:
    uses: ./.github/workflows/backend-tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    # Only one deploy at a time. Overlapping runs share /opt/aegis on the
    # droplet and collided on git's index.lock and on recreating the worker
    # container. Queue instead of cancelling so a run never dies mid docker
    # compose down/up. Set on the job, not the workflow, so tests for a newer
    # push can run while an older deploy is still going.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Default (10m) is too tight for a full no-cache rebuild (pruning
          # docker state before every build means no layer cache ever
          # survives) on this droplet's shared CPU/RAM - a run that hit
          # 10m9s died mid image-export, after the build had already spent
          # real time downloading/installing, but before docker compose
          # down/up ran (so it failed safely: the previous container kept
          # serving, nothing was left half-restarted).
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "--- disk usage before cleanup ---"
            df -h /
            docker system df -v || true
            echo "--- cleaning OS-level cruft (apt cache, old kernels, journal logs) ---"
            apt-get clean || true
            apt-get autoremove -y || true
            journalctl --vacuum-size=100M || true
            echo "--- pruning ALL docker state (safe: docker compose up --build recreates everything) ---"
            docker system prune -af --volumes || true
            echo "--- disk usage after cleanup, before build ---"
            df -h /
            cd /opt/aegis
            git fetch origin main
            git reset --hard origin/main
            docker compose -f deploy/digitalocean/docker-compose.yml --env-file deploy/digitalocean/.env build
            docker compose -f deploy/digitalocean/docker-compose.yml --env-file deploy/digitalocean/.env down --remove-orphans || true
            docker compose -f deploy/digitalocean/docker-compose.yml --env-file deploy/digitalocean/.env up -d --no-build
            docker image prune -f
            echo "--- disk usage after build ---"
            df -h /
