name: Deploy Backend to DigitalOcean

on:
  push:
    branches: [ "main" ]
    paths:
      - "imperium-api/**"
      - "deploy/digitalocean/**"
  workflow_dispatch: {}

jobs:
  # The deploy only runs if the backend test suite passes for this commit.
  tests:
    uses: ./.github/workflows/backend-tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    # Only one deploy at a time. Overlapping runs share /opt/aegis on the
    # droplet and collided on git's index.lock and on recreating the worker
    # container. Queue instead of cancelling so a run never dies mid docker
    # compose down/up. Set on the job, not the workflow, so tests for a newer
    # push can run while an older deploy is still going.
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      # A broken Caddyfile would take the whole API offline once the
      # droplet recreates Caddy, so prove it parses before touching it.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/digitalocean
      - name: Validate Caddyfile
        run: |
          docker run --rm -e API_HOSTNAME=api.example.com \
            -v "$PWD/deploy/digitalocean/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # Default (10m) is too tight for a full no-cache rebuild (pruning
          # docker state before every build means no layer cache ever
          # survives) on this droplet's shared CPU/RAM - a run that hit
          # 10m9s died mid image-export, after the build had already spent
          # real time downloading/installing, but before docker compose
          # down/up ran (so it failed safely: the previous container kept
          # serving, nothing was left half-restarted).
          command_timeout: 20m
          script: |
            set -euo pipefail
            echo "--- disk usage before cleanup ---"
            df -h /
            docker system df -v || true
            echo "--- cleaning OS-level cruft (apt cache, old kernels, journal logs) ---"
            apt-get clean || true
            apt-get autoremove -y || true
            journalctl --vacuum-size=100M || true
            echo "--- pruning old container and image state (volumes preserved) ---"
            docker system prune -af || true
            echo "--- disk usage after cleanup, before build ---"
            df -h /
            cd /opt/aegis
            git fetch origin main
            git reset --hard origin/main
            COMPOSE="docker compose -f deploy/digitalocean/docker-compose.yml --env-file deploy/digitalocean/.env"
            $COMPOSE build
            # Blue/green on one droplet: the API takes ~1-2 min to boot, longer than
            # Caddy's 45s hold, so restarting it in place still dropped requests.
            # Start the new container beside the old one, switch only once it
            # answers /health, then drain the old one. Caddy resolves imperium-api
            # to every running replica and retries dial failures, so traffic
            # follows whichever container is up.
            OLD=$($COMPOSE ps -q imperium-api || true)
            echo "--- memory before rollout ---"; free -m
            if [ -z "$OLD" ]; then
              $COMPOSE up -d --no-build imperium-api
              NEW=$($COMPOSE ps -q imperium-api)
            else
              REPLICAS=$(( $(echo "$OLD" | wc -l) + 1 ))
              $COMPOSE up -d --no-build --no-recreate --scale imperium-api=$REPLICAS imperium-api
              NEW=$($COMPOSE ps -q imperium-api | grep -v -x -F "$OLD" | head -1)
            fi
            echo "--- waiting for new API container ${NEW:0:12} to answer /health ---"
            HEALTHY=""
            for i in $(seq 1 90); do
              if docker exec "$NEW" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)" >/dev/null 2>&1; then
                HEALTHY=1; echo "healthy after ~$((i * 5))s"; break
              fi
              sleep 5
            done
            if [ -z "$HEALTHY" ]; then
              echo "::error::New API container never became healthy - removing it; the previous release keeps serving."
              docker logs --tail 150 "$NEW" || true
              docker rm -f "$NEW" || true
              exit 1
            fi
            echo "--- applying database migrations ---"
            docker exec "$NEW" python migrations/run_aegis_migrations.py
            if [ -n "$OLD" ]; then
              echo "--- draining previous API container(s) ---"
              # SIGTERM: uvicorn stops accepting and finishes in-flight requests.
              docker stop -t 30 $OLD
              docker rm $OLD
            fi
            echo "--- memory after rollout ---"; free -m
            # Background worker and Caddy: recreate only if their image/config changed.
            # (Never "down": that stopped Caddy, and the site's API proxy got
            # ECONNREFUSED on :443 for the whole restart.)
            $COMPOSE up -d --no-build --no-deps --remove-orphans imperium-worker caddy
            docker image prune -f
            echo "--- disk usage after build ---"
            df -h /

  # Plan every SQL statement against the live schema once the new release is up.
  sql-health:
    needs: deploy
    uses: ./.github/workflows/sql-health-check.yml
    secrets: inherit
