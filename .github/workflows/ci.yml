name: CI

# Before this existed, `deploy-backend.yml` was the only workflow in the
# repository: a push to main SSHed into the droplet and rebuilt production
# with no checks run first. The repo already carried 108 backend test files
# and a frontend typecheck/lint setup, and nothing ever executed either of
# them. This workflow is the gate.
#
# It deliberately also enforces two *performance* budgets, because the
# regressions that made this app slow were all of a kind that a correctness
# test would happily let through: an N+1 loop of round trips inside a GET, and
# an ever-growing client bundle.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migration ledger)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imperium-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            imperium-api/requirements.txt
            imperium-api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (blocking - real bugs only)
        # Syntax errors, undefined names, invalid comparisons. Zero today; keep it zero.
        run: ruff check --select E9,F63,F7,F82 .

      - name: Lint (full ruleset - report only)
        # main already carries ~60 style findings (unused imports, bare
        # f-strings). Reported here so the count is visible on every PR; flip
        # continue-on-error off once it reaches zero.
        continue-on-error: true
        run: ruff check --statistics .

      - name: Byte-compile every module
        # Catches syntax errors and bad imports in the many routers that no
        # test happens to import.
        run: python -m compileall -q routers core app schemas

      - name: Validate migration ordering
        # The migration ledger is keyed by filename and several historical
        # migrations share a numeric prefix; the guard in
        # migrations/migration_ledger.py allows those but rejects a *new*
        # migration that reuses a number. Run it here so a bad filename is
        # caught in review rather than at deploy time.
        run: |
          python - <<'PY'
          from migrations.migration_ledger import (
              discover_all_raw_migrations,
              validate_unique_filenames,
              validate_no_new_duplicate_sequence_numbers,
          )

          migrations = discover_all_raw_migrations()
          validate_unique_filenames(migrations)
          # No ledger available in CI, so treat every historical duplicate as
          # already applied and only fail on a newly introduced collision.
          applied = {m.filename: m.checksum for m in migrations}
          validate_no_new_duplicate_sequence_numbers(migrations, applied)
          print(f"{len(migrations)} migrations, ordering OK")
          PY

      - name: Tests
        # Three tests are deselected because they were already failing on main
        # before this workflow existed, for reasons unrelated to any change:
        #  - test_materials_forecast_alerts needs a live Postgres with seeded
        #    inventory data; there is no database service in this job.
        #  - test_no_new_migrations_needed hard-caps the migration number at
        #    197 ("Phase 6A should need none"), and 198/199 have since shipped.
        #  - test_settings_validation expects CORS origin localhost:3010, but
        #    core/config.py ALLOWED_ORIGINS defaults to localhost:3000.
        # Both need an owner decision (DB service / retire the phase cap), not
        # a silent skip - they are listed here so they stay visible.
        run: >-
          pytest -q --maxfail=5
          --deselect tests/test_executive_extensions.py::test_materials_forecast_alerts
          --deselect tests/test_cash_forecast_contract.py::Phase6ASharedFunctionContractTests::test_no_new_migrations_needed
          --deselect tests/test_standardized_stack.py::StandardizedStackCalculationsTests::test_settings_validation

  frontend:
    name: Frontend (typecheck, lint, build, bundle budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aegis-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Explicitly separate from the build, because next.config.ts can be
        # told to ignore type errors during the build via
        # AEGIS_SKIP_NEXT_TYPECHECK. This step cannot be skipped that way.
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Navigation completeness
        run: npm run check:nav

      - name: Build
        env:
          AEGIS_SKIP_NEXT_TYPECHECK: "0"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: First-load JS budget
        # Guards the regression that actually hurts users: route bundles
        # creeping up until a page takes seconds to become interactive. Next
        # reports First Load JS per route in the build output; this fails the
        # job if the shared chunk crosses the budget.
        #
        # Budget is set from the current measured value (165.5 kB gzipped for
        # the shared App Router entry) plus ~35 kB of headroom, rather than
        # from an aspirational number - so it catches growth without blocking
        # unrelated work. Lower it as code-splitting lands.
        env:
          FIRST_LOAD_BUDGET_KB: "200"
        run: node scripts/check-bundle-budget.js
