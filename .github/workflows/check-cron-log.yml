name: One-off - Check aegis-cron.log

on:
  workflow_dispatch: {}

jobs:
  check-log:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and tail cron log
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "--- crontab ---"
            cat /etc/cron.d/aegis-automation
            echo "--- last 200 lines of aegis-cron.log ---"
            tail -n 200 /var/log/aegis-cron.log || echo "(log file missing or empty)"
            echo "--- entries mentioning our new scripts ---"
            grep -E "run_hr_workforce_alerts|run_compliance_alerts|run_hse_escalation" /var/log/aegis-cron.log || echo "(no matching lines found)"
